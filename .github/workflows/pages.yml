# Validates the workbook, rebuilds the dashboard data and publishes site/ to GitHub Pages.
# A failed validation, data test or browser test stops the deployment.
name: Deploy dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Pinned: Playwright 1.60 cannot install its browser dependencies on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate workbook and build dashboard data
        run: python -m pipeline.build_site_data
      - name: Browser for the dashboard tests
        run: python -m playwright install --with-deps chromium
      - name: Data and dashboard tests
        run: python -m pytest tests -q
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
